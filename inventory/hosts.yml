---
# The demigods cluster: 5 x Raspberry Pi 5 on the k8s0 network (192.168.5.0/26)
# behind the OpenWRT router. Addresses come from static DHCP leases keyed on
# the MAC addresses below. The playbook checks that each lease matches.
all:
  children:
    demigods:
      vars:
        ansible_user: bbrietzke
        ansible_host: "{{ network_prefix }}.{{ ip_octet }}"
        node_ip: "{{ network_prefix }}.{{ ip_octet }}"
      children:
        control_plane:
          hosts:
            hercules:
              ip_octet: 9
              mac_address: "88:A2:9E:29:ED:25"
              ram_gb: 8
              storage_node: false
        workers:
          hosts:
            achilles:
              ip_octet: 11
              mac_address: "2c:cf:67:c7:86:d2"
              ram_gb: 16
              storage_node: true
            perseus:
              ip_octet: 13
              mac_address: "88:a2:9e:00:07:d2"
              ram_gb: 16
              storage_node: true
            helen:
              ip_octet: 17
              mac_address: "2C:CF:67:E4:89:EB"
              ram_gb: 16
              storage_node: true
            aenes:
              ip_octet: 19
              mac_address: "88:A2:9E:7A:3B:62"
              ram_gb: 16
              storage_node: true
